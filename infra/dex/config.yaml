# Development-only OIDC provider. These identities are disposable and synthetic.
# Production must use a managed OIDC provider (see docs/DEPLOYMENT.md).
issuer: http://localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]
staticClients:
  - id: social-lite-local
    name: Social Lite (local)
    secret: social-lite-local-client-secret
    redirectURIs:
      - http://localhost:3000/api/auth/callback
      - http://127.0.0.1:3000/api/auth/callback
      - http://localhost:3100/api/auth/callback
enablePasswordDB: true
# Password for every local user: "socialite-demo"
