# Relay login theme (D34): passwordless sign-in pages, light, Relay-branded. Parent "base" = Keycloak's unstyled templates;
# every page is rendered through our template.ftl and styled by css/relay.css (no PatternFly).
parent=base
import=common/keycloak
styles=css/relay.css
locales=en

kcHtmlClass=relay
kcBodyClass=relay-body
kcFormClass=relay-form
kcFormGroupClass=relay-group
kcFormSettingClass=relay-settings
kcLabelWrapperClass=relay-label-wrap
kcLabelClass=relay-label
kcInputWrapperClass=relay-input-wrap
kcInputClass=relay-input
kcInputErrorMessageClass=relay-field-error
kcInputHelperTextBeforeClass=relay-help
kcInputHelperTextAfterClass=relay-help
kcFormOptionsClass=relay-options
kcFormOptionsWrapperClass=relay-options-wrap
kcFormButtonsClass=relay-buttons
kcFormButtonsWrapperClass=relay-buttons
kcButtonClass=relay-btn
kcButtonPrimaryClass=relay-btn-primary
kcButtonDefaultClass=relay-btn-secondary
kcButtonSecondaryClass=relay-btn-secondary
kcButtonBlockClass=relay-btn-block
kcButtonLargeClass=
kcAlertClass=relay-alert
kcFormSocialAccountListButtonClass=relay-btn relay-btn-idp
kcLoginOTPListClass=relay-otp-choice
kcLoginOTPListInputClass=relay-otp-radio
kcLoginOTPListItemTitleClass=relay-otp-choice-title
kcSelectAuthListClass=relay-select-list
kcSelectAuthListItemClass=relay-select-item
kcSelectAuthListItemHeadingClass=relay-select-heading
kcSelectAuthListItemDescriptionClass=relay-select-desc
kcRecoveryCodesList=relay-codes
kcRecoveryCodesActions=relay-row
kcCheckboxInputClass=relay-checkbox
kcWebAuthnKeyIcon=relay-hidden
kcWebAuthnDefaultIcon=relay-hidden
