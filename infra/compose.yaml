# Local development / review infrastructure. All services are disposable and
# bound to 127.0.0.1 only. Production uses managed equivalents (see docs/DEPLOYMENT.md).
name: social-lite
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialite
      POSTGRES_PASSWORD: socialite-local-only
      POSTGRES_DB: socialite_dev
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialite -d socialite_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (SeaweedFS). Private buckets; access via signed URLs only.
  storage:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-volume.max=0"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Keycloak: standards-based OIDC provider for local development (disposable identities, realm
  # infra/keycloak/social-lite-realm.json imported on first start). Passwordless (D34): email link + 6-digit code
  # (Mailpit below catches the emails), Google when configured; TOTP, passkeys (WebAuthn), recovery codes,
  # LoA step-up (acr "password"=1 [= email sign-in], "mfa"=2), amr, back-channel logout. Same image as production
  # (infra/keycloak/Dockerfile: Keycloak 26.4 + keycloak-magic-link + relay-auth + Relay theme).
  # Admin console: http://localhost:5556/admin (admin / socialite-kc-admin-local-only).
  # Re-import after editing the realm: up -d --force-recreate oidc · after editing the theme/provider: up -d --build oidc
  oidc:
    build: ./keycloak
    image: relay-keycloak:dev
    command: ["start-dev", "--import-realm", "--http-port=5556", "--hostname=http://localhost:5556", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: socialite-kc-admin-local-only
      KC_LOG_LEVEL: info
    ports: ["127.0.0.1:5556:5556"]
    # Back-channel logout calls the app on the host (http://host.docker.internal:3000/api/auth/backchannel-logout).
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./keycloak/social-lite-realm.json:/opt/keycloak/data/import/social-lite-realm.json:ro
      # Theme edits show up without a rebuild (start-dev disables theme caching).
      - ./keycloak/themes/relay:/opt/keycloak/themes/relay:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  # Local email capture. UI: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  s3data:
